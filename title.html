<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MangALL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Оформление один в один со страницей тайтла mangall-next (localhost:3001/manga/…): её style.css и иконки -->
<link rel="stylesheet" href="next/style.css">
<style>
  .manga-chapters + .manga-chapters { margin-top: 24px; }
  .manga-chapters-head h2 small { font: 500 13px 'Golos Text', sans-serif; color: var(--text-dim); margin-left: 8px; }
  .manga-cover-img.is-empty { background: var(--surface2); }
  .col-bar { position: relative; display: inline-block; margin-top: 12px; }
  .col-pop { position: absolute; left: 0; top: calc(100% + 8px); min-width: 230px; z-index: 50; padding: 8px 0;
    background: var(--surface, #fff); border: 1px solid var(--border, #ddd); box-shadow: 0 8px 30px rgba(0,0,0,.25); }
  .col-item { display: block; width: 100%; text-align: left; font: inherit; padding: 10px 16px; background: none; border: 0; color: inherit; cursor: pointer; }
  .col-item:hover { background: var(--surface2, #f3f3f3); }
  .col-item.on { color: var(--accent, #b3261e); font-weight: 700; }
  .col-div { height: 1px; background: var(--border, #ddd); margin: 6px 12px; }
</style>
</head>
<body>

<header class="nav">
  <div class="footer-dots" aria-hidden="true"></div>
  <a href="./" class="logo">MangALL</a>
  <div class="nav-search-wrap">
    <div class="nav-search-frame">
      <div class="nav-search">
        <span class="icon icon-search"></span>
        <input type="text" id="nav-search-input" placeholder="Найти мангу..." autocomplete="off">
      </div>
    </div>
    <div class="nav-search-dropdown" id="nav-search-dropdown" hidden></div>
  </div>
  <div class="nav-account">
    <button class="account-toggle-frame" id="account-toggle" aria-label="Меню аккаунта" aria-expanded="false" aria-haspopup="true">
      <span class="account-toggle">
        <span class="icon icon-user" id="account-toggle-icon"></span>
        <!-- Показывается вместо иконки-заглушки, когда человек залогинен
             — см. initAuth() в common.js. Обрезается тем же уголком, что
             и вся кнопка (.account-toggle clip-path режет и содержимое,
             отдельный clip-path на самой картинке не нужен). -->
        
      </span>
    </button>
    <div class="account-menu-arrow" aria-hidden="true"></div>
    <div class="account-menu" id="account-menu">
      <div class="account-menu-dots" aria-hidden="true"></div>
      <a href="profile.html" class="account-menu-item">
        <span class="icon icon-user"></span>
        <span class="account-menu-label">Профиль</span>
      </a>
      <button class="account-menu-item" id="auth-item" type="button">
        <span class="icon icon-user"></span>
        <span class="account-menu-label" id="auth-item-label">Войти через Google</span>
      </button>
      <div class="account-menu-divider"></div>
      <button class="account-menu-item" id="theme-toggle">
        <span class="account-menu-icon">
          <span class="icon icon-sun"></span>
          <span class="icon icon-moon"></span>
        </span>
        <span class="account-menu-label">Тема</span>
      </button>
    </div>
  </div>
</header>

<main>
  <section class="section" id="manga-page">
    <div class="manga-banner section-inset">
      <div class="manga-cover-frame">
        <img class="manga-cover-img" id="manga-cover" src="" alt="" referrerpolicy="no-referrer">
      </div>
      <div class="manga-meta">
        <div class="manga-type-line" id="manga-type-line"></div>
        <h1 class="manga-title" id="manga-title"></h1>
        <div class="manga-alt-title" id="manga-alt-title" hidden></div>
        <div class="manga-tags" id="manga-tags"></div>
        <div class="manga-badges" id="manga-badges"></div>
        <div class="col-bar" id="col-bar" hidden>
          <button type="button" class="catalog-chip" id="col-btn"><span class="catalog-chip-inner"><span id="col-label">В коллекцию</span></span></button>
          <div class="col-pop" id="col-pop" hidden>
            <button type="button" class="col-item" data-st="favorite">Любимое</button>
            <button type="button" class="col-item" data-st="planned">В планах</button>
            <button type="button" class="col-item" data-st="reading">Читаю</button>
            <button type="button" class="col-item" data-st="completed">Прочитано</button>
            <button type="button" class="col-item" data-st="dropped">Брошено</button>
            <div class="col-div" aria-hidden="true"></div>
            <button type="button" class="col-item" data-st="">Убрать из коллекции</button>
          </div>
        </div>
        <div class="manga-desc" id="manga-desc"></div>
        <button class="manga-desc-toggle" id="manga-desc-toggle" hidden>Показать полностью</button>
      </div>
    </div>

    <!-- английские главы с MangaDex (если манга там есть) -->
    <div class="manga-chapters section-inset" id="en-block" hidden>
      <div class="manga-chapters-head">
        <h2>Главы<small>MangaDex · английский</small></h2>
        <button type="button" class="catalog-chip sort-btn"><span class="catalog-chip-inner">Новые сверху</span></button>
      </div>
      <div class="manga-chapter-list" id="en-list"><div class="grid-loading">Загрузка...</div></div>
    </div>

    <!-- русские главы: readmanga / Senkuro / seimanga / MangaLib -->
    <div class="manga-chapters section-inset" id="ru-block">
      <div class="manga-chapters-head">
        <h2>Главы<small id="ru-src">на русском</small></h2>
        <button type="button" class="catalog-chip sort-btn"><span class="catalog-chip-inner">Новые сверху</span></button>
      </div>
      <div class="manga-chapter-list" id="ru-list"><div class="grid-loading">Ищу на русских сайтах...</div></div>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="footer-dots" aria-hidden="true"></div>
  <span class="logo footer-logo">MangALL</span>
  <p>Читай любимую мангу, манхву и маньхуа с переводом от сообщества.</p>
</footer>

<script src="next/common.js"></script>
<script>window.SITE = window.SITE || { root: '', gclient: '457192894158-51mr293gi026t8k3iph3o9i4m57ouo19.apps.googleusercontent.com',
  api: (location.hostname === 'localhost' || location.hostname === '127.0.0.1') ? 'https://mangall-suggest-dev.nake000071.workers.dev' : 'https://mangall-suggest.nake000071.workers.dev' };</script>
<script src="auth.js"></script>
<script>
const $ = id => document.getElementById(id);
// на localhost поиск readmanga и главы — с Worker mangall-relay; /title и /mdch — локальный relay
const RELAY_CH = 'https://mangall-relay.nake000071.workers.dev';   // поиск readmanga и главы — с Worker везде
const read = u => 'rm.html?u=' + encodeURIComponent(u) + '&t=' + (+new URLSearchParams(location.search).get('id') || '');   // &t — чтобы из читалки вернуться сюда

const STATUS = { ongoing: 'Онгоинг', completed: 'Завершён', hiatus: 'Приостановлен', cancelled: 'Отменён' };
const TYPE = { ja: 'Манга', ko: 'Манхва', zh: 'Маньхуа', 'zh-hk': 'Маньхуа' };
const FMT = { ONE_SHOT: 'Ваншот', NOVEL: 'Ранобэ' };
const plural = (n, a, b, c) => n % 10 === 1 && n % 100 !== 11 ? a : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? b : c;

// --- строки глав: та же вёрстка, что у mangall-next ---
function rowHTML(c) {
  return `<a class="manga-chapter-row" href="${esc(read(c.url))}">
      <span class="manga-chapter-num">${esc(c.num)}</span>
      <span class="manga-chapter-title">${esc(c.title)}</span>
      <span class="manga-chapter-pages">${esc(c.pages || '')}</span>
      <span class="icon icon-chevron-right"></span>
    </a>`;
}
const lists = { en: [], ru: [] };   // от новых к старым
let newestFirst = true;
function render(which) {
  const el = $(which + '-list'), l = newestFirst ? lists[which] : lists[which].slice().reverse();
  el.innerHTML = l.length ? l.map(rowHTML).join('') : '<div class="grid-loading">Глав пока нет.</div>';
}
document.querySelectorAll('.sort-btn').forEach(b => b.onclick = () => {
  newestFirst = !newestFirst;
  document.querySelectorAll('.sort-btn .catalog-chip-inner').forEach(s => s.textContent = newestFirst ? 'Новые сверху' : 'Старые сверху');
  if (lists.en.length) render('en');
  if (lists.ru.length) render('ru');
});

function setupDescription(text) {
  const el = $('manga-desc'), btn = $('manga-desc-toggle');
  el.textContent = text;
  requestAnimationFrame(() => {
    if (el.scrollHeight > el.clientHeight + 2) {
      btn.hidden = false;
      btn.onclick = () => { el.classList.toggle('expanded'); btn.textContent = el.classList.contains('expanded') ? 'Свернуть' : 'Показать полностью'; };
    }
  });
}

// --- MangaLib (API отвечает браузеру, не relay) — как в rm.html ---
const ML_API = 'https://api.cdnlibs.org/api';
async function mlGet(p) { const r = await fetch(ML_API + p, { headers: { 'Site-Id': '1' } }); if (!r.ok) throw new Error('MangaLib ' + r.status); return (await r.json()).data; }
async function mlFind(q, alt) {
  const norm = t => String(t || '').toLowerCase().replace(/ё/g, 'е').replace(/[^a-zа-я0-9]+/g, '');
  const want = [q, alt].map(norm).filter(n => n.length >= 3);
  for (const term of [q, alt].filter(Boolean)) {
    const res = (await mlGet('/manga?q=' + encodeURIComponent(term) + '&site_id[]=1')) || [];
    const hit = res.find(x => [x.rus_name, x.eng_name, x.name].map(norm).some(n => want.includes(n)));
    if (hit) return hit.slug_url;
  }
  return null;
}
async function mlChapters(slug) {
  const list = (await mlGet(`/manga/${slug}/chapters`)) || [];
  return list.map(x => ({ url: `https://mangalib.me/ru/${slug}/read/v${x.volume}/c${x.number}`,
    num: `Том ${x.volume} Глава ${x.number}`, title: x.name || '', pages: '' })).reverse();
}

// «1 - 4 Железная девушка» (readmanga/seimanga) → «Том 1 Глава 4» + «Железная девушка»
function ruRow(c) {
  const m = String(c.title || '').match(/^(\S+)\s+-\s+(\S+)\s*(.*)$/);
  return m ? { url: c.url, num: `Том ${m[1]} Глава ${m[2]}`, title: m[3], pages: '' } : { url: c.url, num: c.title || 'Глава', title: '', pages: '' };
}
const SRC = u => /senkuro/.test(u) ? 'Senkuro' : /seimanga|zazaza/.test(u) ? 'seimanga' : /mangalib/.test(u) ? 'MangaLib' : 'readmanga';

async function loadRussian(t) {
  // манга из MangaDex: ищем по английскому/ромадзи названию, без пометок в скобках в конце
  const clean = s => String(s || '').replace(/\s*[(\[][^()\[\]]*[)\]]\s*$/, '').trim();
  const [q, alt] = t.md && t.alt ? [clean(t.alt), clean(t.title)] : [t.title, t.alt];
  let url = null;
  try {
    const d = await (await fetch(`${RELAY_CH}/find?q=${encodeURIComponent(q)}&alt=${encodeURIComponent(alt)}&al=${t.id}${t.md && t.year ? '&y=' + t.year : ''}`)).json();
    url = d.url || null;
  } catch (_) {}
  if (url) {
    $('ru-src').textContent = SRC(url) + ' · русский';
    try {
      let d = await (await fetch(RELAY_CH + '/chapter?u=' + encodeURIComponent(url))).json();
      if (d.error) throw new Error(d.error);
      lists.ru = (d.chapters || []).map(ruRow);
      if (!lists.ru.length) lists.ru = [{ url: d.url || url, num: d.chapter ? 'Глава ' + d.chapter : 'Читать', title: '', pages: '' }];
    } catch (_) {
      lists.ru = [{ url, num: 'Читать', title: 'список глав не загрузился — откроется первая глава', pages: '' }];
    }
    return render('ru');
  }
  try {
    const slug = await mlFind(q, alt);
    if (slug) { $('ru-src').textContent = 'MangaLib · русский'; lists.ru = await mlChapters(slug); return render('ru'); }
  } catch (_) {}
  $('ru-list').innerHTML = '<div class="grid-loading">На readmanga, Senkuro, seimanga и MangaLib не нашлось.</div>';
}

async function loadEnglish(uuid) {
  $('en-block').hidden = false;
  try {
    const l = await (await fetch(RELAY + '/mdch?id=' + uuid)).json();
    if (l.error) throw new Error(l.error);
    if (!l.length) { $('en-block').hidden = true; return; }
    lists.en = l.map(c => ({ url: c.url, num: c.number ? 'Глава ' + c.number : 'Ваншот', title: c.title, pages: c.pages ? c.pages + ' стр.' : '' }));
    render('en');
  } catch (e) {
    $('en-list').innerHTML = '<div class="grid-loading">MangaDex не ответил: ' + esc(e.message) + '</div>';
  }
}

// --- коллекция (статусы как в mangall-next): вход через Google, данные — Worker mangall-suggest ---
const COL_LABEL = { favorite: 'Любимое', planned: 'В планах', reading: 'Читаю', completed: 'Прочитано', dropped: 'Брошено' };
let colState = { mid: 0, status: null, title: '', cover: '' };
function colRender() {
  $('col-bar').hidden = false;
  if (!window.MAuth || !MAuth.user) { $('col-label').textContent = 'В коллекцию (войти)'; return; }
  $('col-label').textContent = colState.status ? COL_LABEL[colState.status] : 'В коллекцию';
  $('col-pop').querySelectorAll('[data-st]').forEach(b => b.classList.toggle('on', b.dataset.st === (colState.status || '')));
}
async function colLoad() {
  if (window.MAuth && MAuth.user) {
    try {
      const d = await MAuth.api('/collection');
      const it = d.items.find(x => x.mid === colState.mid);
      colState.status = it ? it.status : null;
    } catch (e) { colState.status = null; }
  } else colState.status = null;
  colRender();
}
async function colSet(st) {
  if (!MAuth.user) return MAuth.open('Войдите через Google, чтобы добавить тайтл в коллекцию');
  try {
    await MAuth.api('/collection', { method: 'PUT', body: { mid: colState.mid, status: st, title: colState.title, cover: colState.cover } });
    colState.status = st; colRender();
  } catch (e) { $('col-label').textContent = 'Ошибка: ' + e.message; }
}
function setupCollection(id, cover, title) {
  colState = { mid: id, status: null, title: title || '', cover: cover || '' };
  if (!window.MAuth) { $('col-bar').hidden = true; return; }
  $('col-btn').onclick = () => {
    if (!MAuth.user) return MAuth.open('Войдите через Google, чтобы добавить тайтл в коллекцию');
    $('col-pop').hidden = !$('col-pop').hidden;
  };
  $('col-pop').querySelectorAll('[data-st]').forEach(b => b.onclick = () => { $('col-pop').hidden = true; colSet(b.dataset.st || null); });
  document.addEventListener('click', e => { if (!e.target.closest('#col-bar')) $('col-pop').hidden = true; });
  const ai = document.getElementById('auth-item');
  if (ai) ai.onclick = () => MAuth.open();
  MAuth.onChange(u => { colLoad(); const l = document.getElementById('auth-item-label'); if (l) l.textContent = u ? 'Аккаунт: ' + (u.given_name || u.name || u.email) : 'Войти через Google'; });
  colLoad();
  const l = document.getElementById('auth-item-label'); if (l) l.textContent = MAuth.user ? 'Аккаунт: ' + (MAuth.user.given_name || MAuth.user.name || MAuth.user.email) : 'Войти через Google';
}

(async function main() {
  const id = +new URLSearchParams(location.search).get('id');
  let t;
  try {
    const r = await fetch(RELAY + '/title?id=' + id);
    t = await r.json();
    if (t.error) throw new Error(t.error);
  } catch (e) {
    $('manga-title').textContent = 'Не получилось открыть';
    $('manga-desc').textContent = e.message + '. Запущен ли relay (node relay.js)?';
    $('ru-block').hidden = true;
    return;
  }
  document.title = t.title + ' — MangALL';
  const cov = t.cover ? (t.cover[0] === '~' ? t.mdcover + t.cover.slice(1) + '.webp' : t.cover.startsWith('http') ? t.cover : t.coverBase + 'large/' + t.cover) : '';
  if (cov) $('manga-cover').src = cov; else $('manga-cover').classList.add('is-empty');
  $('manga-title').textContent = t.title;
  if (t.alt && t.alt !== t.title) { $('manga-alt-title').textContent = t.alt; $('manga-alt-title').hidden = false; }
  $('manga-type-line').textContent = [FMT[t.format] || TYPE[t.lang] || 'Манга', t.author, t.year || ''].filter(Boolean).join(' · ');
  $('manga-tags').innerHTML = t.genres.concat(t.tags).slice(0, 12).map(g => `<span class="catalog-card-tag">${esc(g)}</span>`).join('');
  $('manga-badges').innerHTML = [STATUS[t.status], t.score ? '★ ' + (t.score / 10).toFixed(1) : '', t.adult ? '18+' : '']
    .filter(Boolean).map(b => `<span class="manga-badge">${esc(b)}</span>`).join('');
  setupDescription(t.description || '');
  if (t.mangadex) loadEnglish(t.mangadex);
  loadRussian(t);
  setupCollection(id, cov, t.title);
})();
</script>
</body>
</html>
