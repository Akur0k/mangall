<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <!-- Фоновый тайл-«обои» в духе вацапа, только комиксными дудлами вместо
       иконок: разрывы-звёзды, пустой речевой пузырь, кучка Ben-Day точек,
       сердечко, огонёк, молния, «твинкл»-искра — раскиданы асимметрично
       по большому тайлу (360px), чтобы повтор не читался при обычном
       скролле. opacity — на всей группе разом, чтобы сам рисунок
       оставался «чистым» (сплошной цвет), а бледность — единственная
       переменная тут. -->
  <g opacity="0.045" fill="none" stroke="#a91e22" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- разрыв-звезда (comic burst), без текста -->
    <g transform="translate(70,64) rotate(12)">
      <polygon points="18,0 6.06,3.5 9,15.6 0,7 -9,15.6 -6.06,3.5 -18,0 -6.06,-3.5 -9,-15.6 0,-7 9,-15.6 6.06,-3.5" />
    </g>

    <!-- пустой речевой пузырь -->
    <g transform="translate(255,120) rotate(-8)">
      <rect x="-26" y="-16" width="52" height="32" rx="9" />
      <polyline points="-10,16 -4,16 -16,27" />
    </g>

    <!-- кучка Ben-Day точек -->
    <g transform="translate(90,255)" stroke="none" fill="#a91e22">
      <circle cx="0" cy="0" r="2.6" />
      <circle cx="11" cy="-6" r="2.6" />
      <circle cx="-9" cy="-11" r="2.6" />
      <circle cx="15" cy="9" r="2.6" />
      <circle cx="-15" cy="5" r="2.6" />
      <circle cx="4" cy="15" r="2.6" />
      <circle cx="-3" cy="-18" r="2.6" />
    </g>

    <!-- второй, поменьше, разрыв-звезда с другой стороны тайла — иначе на
         широких экранах в глаза бросается, что «звезда только одна» -->
    <g transform="translate(300,300) rotate(200) scale(0.7)">
      <polygon points="18,0 6.06,3.5 9,15.6 0,7 -9,15.6 -6.06,3.5 -18,0 -6.06,-3.5 -9,-15.6 0,-7 9,-15.6 6.06,-3.5" />
    </g>

    <!-- сердечко (контур) -->
    <g transform="translate(178,44) rotate(9) scale(0.9)">
      <path d="M0,-6 C-2,-12 -12,-12 -12,-4 C-12,4 -4,10 0,16 C4,10 12,4 12,-4 C12,-12 2,-12 0,-6 Z" />
    </g>

    <!-- огонёк (как у icon-flame — перекличка с «Рекомендуемым») -->
    <g transform="translate(330,205) rotate(-14) scale(1.1)">
      <path d="M0,-14 C6,-8 6,0 2,4 C4,-2 0,-4 -1,0 C-3,4 2,8 0,14 C-8,10 -10,0 -6,-6 C-4,-9 -2,-11 0,-14 Z" />
    </g>

    <!-- молния (zap) -->
    <g transform="translate(24,158) rotate(18) scale(1.05)">
      <polygon points="4,-16 -10,2 -1,2 -5,16 11,-4 2,-4" />
    </g>

    <!-- твинкл-искра, помельче и мягче, чем разрыв-звезда -->
    <g transform="translate(194,322) rotate(6)">
      <path d="M0,-10 C1,-3 3,-1 10,0 C3,1 1,3 0,10 C-1,3 -3,1 -10,0 C-3,-1 -1,-3 0,-10 Z" />
    </g>
    <g transform="translate(150,190) rotate(-20) scale(0.6)">
      <path d="M0,-10 C1,-3 3,-1 10,0 C3,1 1,3 0,10 C-1,3 -3,1 -10,0 C-3,-1 -1,-3 0,-10 Z" />
    </g>
  </g>
</svg>
